name: Safety Files Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-safety-files-tests
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "core/utils/safety_files/**"
      - ".github/workflows/safety-files-tests.yml"
  push:
    branches: [main]
    paths:
      - "core/utils/safety_files/**"
      - ".github/workflows/safety-files-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest setuptools
      - name: Run the Safety Files test suite
        run: python -m pytest core/utils/safety_files/tests -q
      - name: Build the demo binder
        run: |
          pip install core/utils/safety_files
          safetyfiles build --profile core/utils/safety_files/examples/sample_profile.json --out /tmp/safety-file-demo
