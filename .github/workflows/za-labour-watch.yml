# Weekly check of the South African BCEA earnings threshold used by HRMS
# (RokctAI/pay hrms/pulsar/hrms_pulsar/payroll/za_labour_rules.json).
# Runs here because this repo is public (free Actions minutes). It clones pay
# with MONOREPO_PAT, runs hrms_pulsar.za_labour_watch --propose, and when the
# Department of Labour page shows a new figure it opens a DRAFT pull request in
# pay with that figure marked AUTO-PROPOSED / todo_verify. Nothing merges by
# itself: a person checks the gazette and the effective date first.
# No change, an unreadable page or a missing token all end green with a note.

name: ZA Labour Rules Watch (Weekly)

permissions:
  contents: read

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: za-labour-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
    steps:
      - name: Clone pay
        id: clone
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::MONOREPO_PAT not available; skipping"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/RokctAI/pay.git" pay
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Check threshold and propose
        if: steps.clone.outputs.ok == 'true'
        id: watch
        working-directory: pay/hrms/pulsar
        run: |
          set +e
          OUT="$(python3 -I -c 'import sys; sys.path.insert(0, "."); sys.argv=["w","--propose"]; import runpy; runpy.run_module("hrms_pulsar.za_labour_watch", run_name="__main__")')"
          echo "$OUT"
          echo "result=$OUT" >> "$GITHUB_OUTPUT"
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Open draft PR in pay
        if: steps.watch.outputs.changed == 'true'
        working-directory: pay
        run: |
          BR="auto/za-labour-threshold-$(date +%Y%m%d)"
          git config user.name "rokct-labour-watch"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BR"
          git commit -am "hrms: AUTO-PROPOSED BCEA earnings threshold (check before merging)"
          git push origin "$BR"
          BODY="Weekly ZA labour watch found a new BCEA earnings threshold on the Department of Labour site.

          Result: ${{ steps.watch.outputs.result }}

          DRAFT on purpose: check the figure and its effective date against the gazette, fix the date in za_labour_rules.json (it is set to the day the watch ran), then hand to the gatekeeper."
          jq -n --arg t "hrms: AUTO-PROPOSED BCEA earnings threshold" --arg h "$BR" --arg b "$BODY" \
            '{title:$t, head:$h, base:"main", body:$b, draft:true}' | \
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/RokctAI/pay/pulls -d @- | jq -r '.html_url // .message'
