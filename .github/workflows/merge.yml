name: Auto Merge

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  merge:
    uses: RokctAI/shared-workflows/.github/workflows/universal-merge.yml@c9acb66a7449b7ecaef6c909fbf8b0f899464ac5 # shared-workflows main @ 2026-08-22
    permissions: write-all
    with:
      allowed_users: 'RendaniSinyage, Rendani Sinyage, rokctbot, rokctbot[bot]'
    secrets:
      COUNTER_API_KEY: ${{ secrets.COUNTER_API_KEY }}
