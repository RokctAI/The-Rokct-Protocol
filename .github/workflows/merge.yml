name: Auto Merge

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  merge:
    uses: RokctAI/shared-workflows/.github/workflows/universal-merge.yml@97d7d6f3a7ed312da4c651be55ea95774c190a89 # shared-workflows main @ 2026-08-16
    permissions: write-all
    with:
      allowed_users: 'RendaniSinyage, Rendani Sinyage, rokctbot, rokctbot[bot]'
    secrets:
      COUNTER_API_KEY: ${{ secrets.COUNTER_API_KEY }}
