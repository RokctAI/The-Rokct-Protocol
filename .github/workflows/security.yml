name: Security Scan
on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    permissions: write-all
    uses: RokctAI/shared-workflows/.github/workflows/universal-security.yml@85173adfd739620dd4d74307697e467b3ddc2b29 # shared-workflows main @ 2026-11-18
    secrets:
      COUNTER_API_KEY: ${{ secrets.COUNTER_API_KEY }}
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

