name: Security Scan
on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    permissions: write-all
    uses: RokctAI/shared-workflows/.github/workflows/universal-security.yml@e6e29abcfeb0282f0be44ab21fb16d4f92957e6e # shared-workflows main @ 2026-08-15
    secrets:
      COUNTER_API_KEY: ${{ secrets.COUNTER_API_KEY }}
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

