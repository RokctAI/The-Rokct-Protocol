name: Verify Protocol Lock

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-verify-lock
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify protocol.lock.json, embedded pins and pinned content
        run: python tools/verify_protocol_lock.py
