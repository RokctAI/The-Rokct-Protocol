name: Verify Protocol Lock

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-verify-lock
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify protocol.lock.json, embedded pins and pinned content
        run: python tools/verify_protocol_lock.py
