# Copyright 2026 RokctAI

# Weekly refresh of the SDK consumers reverse index (sdk_consumers.json +
# SDK_CONSUMERS.md). Discovers the org's app shells dynamically — every
# active RokctAI repo whose root composer.json declares a non-empty sdks[]
# list (paas_pos is never indexed, owner rule) — shallow-clones them as
# siblings into a throwaway workspace, reruns tools/gen_sdk_consumers.py
# against it, and commits the two index files back to the default branch
# only when their content actually changed. Repo listing and per-shell
# fetches follow the same curl + MONOREPO_PAT idiom as shared-workflows'
# sdk-bump-poller.yml; transient API failures warn and exit green so a
# flaky week never shows as a red run — the next weekly run catches up.

name: SDK Consumers Refresh (Weekly)

permissions:
  contents: write

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: sdk-consumers-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # MONOREPO_PAT sees private shells; the workflow token is the
      # fallback and still covers every public shell.
      GH_TOKEN: ${{ secrets.MONOREPO_PAT || secrets.GITHUB_TOKEN }}
      ORG: RokctAI
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.MONOREPO_PAT || secrets.GITHUB_TOKEN }}

      - name: Discover and clone consuming shells
        id: discover
        run: |
          WORK="$RUNNER_TEMP/sdk-consumers"
          WORKSPACE="$WORK/workspace"
          mkdir -p "$WORKSPACE"
          AUTH_HEADER="Authorization: Bearer $GH_TOKEN"
          JSON_ACCEPT="Accept: application/vnd.github+json"
          RAW_ACCEPT="Accept: application/vnd.github.raw"

          # --- 1. List org repos (name + default branch), paginated -----------
          REPOS_FILE="$WORK/org-repos.tsv"
          : > "$REPOS_FILE"
          PAGE=1
          LIST_OK=true
          while :; do
            RESP="$(curl -sS -H "$AUTH_HEADER" -H "$JSON_ACCEPT" \
              "https://api.github.com/orgs/$ORG/repos?per_page=100&page=$PAGE" || true)"
            COUNT="$(echo "$RESP" | jq 'if type == "array" then length else -1 end' 2>/dev/null || echo -1)"
            if [ "$COUNT" -lt 0 ] 2>/dev/null; then
              LIST_OK=false
              break
            fi
            [ "$COUNT" -eq 0 ] && break
            echo "$RESP" | jq -r '.[] | select(.archived | not) | [.name, (.default_branch // "main")] | @tsv' >> "$REPOS_FILE"
            [ "$COUNT" -lt 100 ] && break
            PAGE=$((PAGE + 1))
          done

          if [ "$LIST_OK" != "true" ] || [ ! -s "$REPOS_FILE" ]; then
            echo "::warning::Failed to list $ORG repositories (transient API error?); skipping this refresh."
            {
              echo "## SDK Consumers Refresh"
              echo ""
              echo "Could not list \`$ORG\` repositories; this refresh was skipped."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Discovered $(wc -l < "$REPOS_FILE") active repos in $ORG."

          # --- 2. Keep shells (root composer.json with a non-empty sdks[]) ----
          SELF_REPO="${GITHUB_REPOSITORY##*/}"
          SHELLS=""
          while IFS=$'\t' read -r REPO_NAME DEFAULT_BRANCH; do
            [ "$REPO_NAME" = "paas_pos" ] && continue   # never indexed (owner rule)
            [ "$REPO_NAME" = "$SELF_REPO" ] && continue # this protocol repo is not a shell
            COMPOSER="$WORK/composer-$REPO_NAME.json"
            CODE="$(curl -sS -o "$COMPOSER" -w '%{http_code}' -H "$AUTH_HEADER" -H "$RAW_ACCEPT" \
              "https://api.github.com/repos/$ORG/$REPO_NAME/contents/composer.json" || echo 000)"
            [ "$CODE" = "200" ] || continue
            if ! jq empty "$COMPOSER" 2>/dev/null; then
              echo "::warning::$REPO_NAME has a root composer.json that is not valid JSON; skipping it."
              continue
            fi
            if ! jq -e '(.sdks // empty) | type == "array" and length > 0' "$COMPOSER" >/dev/null 2>&1; then
              continue
            fi
            # --- 3. Shallow-clone the shell into the sibling workspace --------
            if git clone --quiet --depth 1 --branch "$DEFAULT_BRANCH" \
              "https://x-access-token:${GH_TOKEN}@github.com/$ORG/$REPO_NAME.git" \
              "$WORKSPACE/$REPO_NAME"; then
              SHELLS="$SHELLS $REPO_NAME"
            else
              echo "::warning::Failed to clone $ORG/$REPO_NAME@$DEFAULT_BRANCH; it will be missing from this refresh."
            fi
          done < "$REPOS_FILE"

          if [ -z "$SHELLS" ]; then
            echo "::warning::No app shells (root composer.json with a non-empty sdks[]) could be cloned; skipping this refresh."
            {
              echo "## SDK Consumers Refresh"
              echo ""
              echo "No shells with \`sdks[]\` could be cloned from \`$ORG\`; this refresh was skipped."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Shells:$SHELLS"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"

      - name: Regenerate the SDK consumers index
        if: steps.discover.outputs.run == 'true'
        run: |
          python3 tools/gen_sdk_consumers.py --workspace "${{ steps.discover.outputs.workspace }}"

      - name: Commit the index to the default branch when it changed
        if: steps.discover.outputs.run == 'true'
        run: |
          if git diff --quiet -- sdk_consumers.json SDK_CONSUMERS.md; then
            echo "Index unchanged; nothing to commit."
            {
              echo "## SDK Consumers Refresh"
              echo ""
              echo "Index regenerated — no changes; nothing was committed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "RokctBOT[bot]"
          git config user.email "2956274+RokctBOT[bot]@users.noreply.github.com"
          git add sdk_consumers.json SDK_CONSUMERS.md
          git commit -m "chore: weekly refresh of SDK consumers index [skip ci]"
          git push origin HEAD
          {
            echo "## SDK Consumers Refresh"
            echo ""
            echo "Index changed — committed \`sdk_consumers.json\` + \`SDK_CONSUMERS.md\` to \`${GITHUB_REF_NAME}\`."
          } >> "$GITHUB_STEP_SUMMARY"
