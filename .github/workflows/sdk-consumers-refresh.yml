# Weekly refresh of the SDK consumers reverse index (sdk_consumers.json +
# SDK_CONSUMERS.md) and of the "Existing SDKs" census block in
# SDK_ECOSYSTEM.md. Discovers repos dynamically across every owner in
# DISCOVERY_OWNERS: app shells are every active repo whose root
# composer.json declares a non-empty sdks[] list (paas_pos is never
# indexed: retired, pos merged into manager); SDK monorepos are every remaining repo with a
# top-level <sdk>/dart/manifest.json or <sdk>/frappe/manifest.json. Both sets are shallow-cloned as siblings
# into a throwaway workspace, tools/gen_sdk_consumers.py reruns against
# it, and the changed files are committed back to the default branch only
# when their content actually changed. Repo listing and per-repo fetches
# follow the same curl + MONOREPO_PAT idiom as shared-workflows'
# sdk-bump-poller.yml; transient API failures warn and exit green so a
# flaky week never shows as a red run — the next weekly run catches up.

name: SDK Consumers Refresh (Weekly)

permissions:
  contents: write

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: sdk-consumers-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # MONOREPO_PAT sees private shells; the workflow token is the
      # fallback and still covers every public shell.
      GH_TOKEN: ${{ secrets.MONOREPO_PAT || secrets.GITHUB_TOKEN }}
      # GitHub orgs/users whose repos are scanned (space- or comma-
      # separated). Additional owners are added here; MONOREPO_PAT must
      # have read access to every owner listed.
      DISCOVERY_OWNERS: "RokctAI"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.MONOREPO_PAT || secrets.GITHUB_TOKEN }}

      - name: Discover and clone shells and SDK monorepos
        id: discover
        run: |
          WORK="$RUNNER_TEMP/sdk-consumers"
          WORKSPACE="$WORK/workspace"
          mkdir -p "$WORKSPACE"
          AUTH_HEADER="Authorization: Bearer $GH_TOKEN"
          JSON_ACCEPT="Accept: application/vnd.github+json"
          RAW_ACCEPT="Accept: application/vnd.github.raw"

          # --- 1. List each owner's repos (owner + name + default branch),
          # paginated. Orgs are listed via /orgs/<owner>/repos; that returns
          # 404 for user accounts, which fall back to /users/<owner>/repos. --
          REPOS_FILE="$WORK/owner-repos.tsv"
          : > "$REPOS_FILE"
          ALL_OWNERS_OK=true
          for OWNER in $(echo "$DISCOVERY_OWNERS" | tr ',' ' '); do
            LIST_URL="https://api.github.com/orgs/$OWNER/repos"
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' -H "$AUTH_HEADER" -H "$JSON_ACCEPT" \
              "$LIST_URL?per_page=1" || echo 000)"
            if [ "$CODE" = "404" ]; then
              LIST_URL="https://api.github.com/users/$OWNER/repos"
            fi
            PAGE=1
            LIST_OK=true
            while :; do
              RESP="$(curl -sS -H "$AUTH_HEADER" -H "$JSON_ACCEPT" \
                "$LIST_URL?per_page=100&page=$PAGE" || true)"
              COUNT="$(echo "$RESP" | jq 'if type == "array" then length else -1 end' 2>/dev/null || echo -1)"
              if [ "$COUNT" -lt 0 ] 2>/dev/null; then
                LIST_OK=false
                break
              fi
              [ "$COUNT" -eq 0 ] && break
              echo "$RESP" | jq -r --arg owner "$OWNER" '.[] | select(.archived | not) | [$owner, .name, (.default_branch // "main")] | @tsv' >> "$REPOS_FILE"
              [ "$COUNT" -lt 100 ] && break
              PAGE=$((PAGE + 1))
            done
            if [ "$LIST_OK" != "true" ]; then
              ALL_OWNERS_OK=false
              echo "::warning::Failed to list $OWNER repositories (transient API error? missing token access?); its repos will be missing from this refresh."
            fi
          done

          if [ "$ALL_OWNERS_OK" != "true" ] || [ ! -s "$REPOS_FILE" ]; then
            echo "::warning::Could not list every owner in DISCOVERY_OWNERS ($DISCOVERY_OWNERS); skipping this refresh."
            {
              echo "## SDK Consumers Refresh"
              echo ""
              echo "Could not list every owner in \`DISCOVERY_OWNERS\` (\`$DISCOVERY_OWNERS\`); this refresh was skipped."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Discovered $(wc -l < "$REPOS_FILE") active repos across: $DISCOVERY_OWNERS."

          # --- 2. Classify repos: shells (root composer.json with a non-empty
          # sdks[]) and SDK monorepos (top-level <sdk>/dart|frappe/manifest.json,
          # spotted via one recursive git-trees call per repo) -----------------
          SELF_REPO="${GITHUB_REPOSITORY##*/}"
          SHELLS=""
          SOURCES=""
          while IFS=$'\t' read -r OWNER REPO_NAME DEFAULT_BRANCH; do
            [ "$REPO_NAME" = "paas_pos" ] && continue   # never indexed (retired: pos merged into manager)
            [ "$REPO_NAME" = "$SELF_REPO" ] && continue # this protocol repo is neither
            if [ -e "$WORKSPACE/$REPO_NAME" ]; then
              echo "::warning::Repo name $REPO_NAME appears under more than one owner; keeping the first clone and skipping $OWNER/$REPO_NAME."
              continue
            fi
            KIND=""
            COMPOSER="$WORK/composer-$OWNER-$REPO_NAME.json"
            CODE="$(curl -sS -o "$COMPOSER" -w '%{http_code}' -H "$AUTH_HEADER" -H "$RAW_ACCEPT" \
              "https://api.github.com/repos/$OWNER/$REPO_NAME/contents/composer.json" || echo 000)"
            if [ "$CODE" = "200" ]; then
              if ! jq empty "$COMPOSER" 2>/dev/null; then
                echo "::warning::$REPO_NAME has a root composer.json that is not valid JSON; skipping it."
                continue
              fi
              if jq -e '(.sdks // empty) | type == "array" and length > 0' "$COMPOSER" >/dev/null 2>&1; then
                KIND="shell"
              fi
            fi
            if [ -z "$KIND" ]; then
              TREE="$WORK/tree-$OWNER-$REPO_NAME.json"
              CODE="$(curl -sS -o "$TREE" -w '%{http_code}' -H "$AUTH_HEADER" -H "$JSON_ACCEPT" \
                "https://api.github.com/repos/$OWNER/$REPO_NAME/git/trees/$DEFAULT_BRANCH?recursive=1" || echo 000)"
              [ "$CODE" = "200" ] || continue
              # A truncated tree cannot prove the absence of SDK dirs, so clone
              # it anyway and let the generator decide from the filesystem.
              if jq -e '(.truncated == true) or ([.tree[]?.path // empty | select(test("^[^/]+/(dart|frappe)/manifest\\.json$"))] | length > 0)' "$TREE" >/dev/null 2>&1; then
                KIND="source"
              else
                continue
              fi
            fi
            # --- 3. Shallow-clone the repo into the sibling workspace ---------
            if git clone --quiet --depth 1 --branch "$DEFAULT_BRANCH" \
              "https://x-access-token:${GH_TOKEN}@github.com/$OWNER/$REPO_NAME.git" \
              "$WORKSPACE/$REPO_NAME"; then
              if [ "$KIND" = "shell" ]; then
                SHELLS="$SHELLS $OWNER/$REPO_NAME"
              else
                SOURCES="$SOURCES $OWNER/$REPO_NAME"
              fi
            else
              echo "::warning::Failed to clone $OWNER/$REPO_NAME@$DEFAULT_BRANCH; it will be missing from this refresh."
            fi
          done < "$REPOS_FILE"

          if [ -z "$SHELLS" ]; then
            echo "::warning::No app shells (root composer.json with a non-empty sdks[]) could be cloned; skipping this refresh."
            {
              echo "## SDK Consumers Refresh"
              echo ""
              echo "No shells with \`sdks[]\` could be cloned from \`$DISCOVERY_OWNERS\`; this refresh was skipped."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Shells:$SHELLS"
          echo "SDK monorepos:$SOURCES"
          if [ -z "$SOURCES" ]; then
            echo "::warning::No SDK monorepos could be cloned; the SDK_ECOSYSTEM.md census block will be left untouched."
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"

      - name: Regenerate the SDK consumers index
        if: steps.discover.outputs.run == 'true'
        run: |
          python3 tools/gen_sdk_consumers.py --workspace "${{ steps.discover.outputs.workspace }}"

      - name: Commit the index to the default branch when it changed
        if: steps.discover.outputs.run == 'true'
        run: |
          if git diff --quiet -- sdk_consumers.json SDK_CONSUMERS.md SDK_ECOSYSTEM.md; then
            echo "Index and census unchanged; nothing to commit."
            {
              echo "## SDK Consumers Refresh"
              echo ""
              echo "Index and census regenerated — no changes; nothing was committed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "RokctBOT[bot]"
          git config user.email "2956274+RokctBOT[bot]@users.noreply.github.com"
          git add sdk_consumers.json SDK_CONSUMERS.md SDK_ECOSYSTEM.md
          git commit -m "chore: weekly refresh of SDK consumers index [skip ci]"
          git push origin HEAD
          {
            echo "## SDK Consumers Refresh"
            echo ""
            echo "Committed the changed files among \`sdk_consumers.json\`, \`SDK_CONSUMERS.md\`, \`SDK_ECOSYSTEM.md\` (census block) to \`${GITHUB_REF_NAME}\`."
          } >> "$GITHUB_STEP_SUMMARY"
