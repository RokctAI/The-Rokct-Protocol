name: Auto Release (Weekly)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-release
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 23 * * 5'
  workflow_dispatch:
    inputs:
      backfill_ai_notes_cutoff_version:
        type: string
        default: ""
        description: "Regenerate AI release notes starting from this version (use 'all' for full history)"

      node-version:
        type: string
        default: '24'
      python-version:
        type: string
        default: '3.14'
      mariadb-version:
        type: string
        default: '10.6'
      postgres-version:
        type: string
        default: '15'
      db-type:
        type: string
        default: 'mariadb'
      version_format:
        type: string
        default: '##.##.##'
        description: "Format for version bumping (e.g. ##.##.## or ##.##.#)"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run Installation Tests
        run: |
          chmod +x tests/test_install.sh
          ./tests/test_install.sh

  release:
    needs: test
    permissions: write-all
    uses: RokctAI/shared-workflows/.github/workflows/universal-pipeline.yml@9597abf51a6f38602142149a7a7fa3e2bb83c56d # shared-workflows PR #416 (gateway envelope)
    with:
      backfill_ai_notes_cutoff_version: ${{ inputs.backfill_ai_notes_cutoff_version }}
      project_type: 'node' # Protocol is not a frappe app
      run_ci: false       # Skip heavy bench installation
      # Dogfooding: Use the new Weekly Strategy
      release_strategy: 'immediately' # rokct-keep
      # RC Cleanup: Delete RC releases/tags after promotion to stable
      cleanup_rc_releases: true
      # One-time cleanup: Set a cutoff date (YYYY-MM-DD) to run cleanup once if past this date
      # After cleanup runs once, a marker file is created and cleanup won't run again
      # Example: one_time_cleanup_cutoff_date: '2026-02-01'
      one_time_cleanup_cutoff_date: '2026-01-30'
      # Brain Endpoint 
      brain_endpoint: https://platform.rokct.ai/api/v1/method/rokct.platform.api
      # Environment configuration
      node-version: ${{ inputs.node-version || '24' }}
      python-version: ${{ inputs.python-version || '3.14' }}
      mariadb-version: ${{ inputs.mariadb-version || '10.6' }}
      postgres-version: ${{ inputs.postgres-version || '15' }}
      db-type: ${{ inputs.db-type || 'mariadb' }}
      version_format: ${{ inputs.version_format || '##.##.##' }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
      GROQ_API: ${{ secrets.GROQ_API }}


