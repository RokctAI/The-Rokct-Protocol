name: "Agent: Automated Git Delegation"

on:
  push:
    paths:
      - '.rokct/agent/queue/*.json'
      - '.rokct/agent/prompts/in_progress/*.json'
    branches:
      - main
  pull_request:
    types: [closed]
  schedule:
    - cron: '0 20 * * *'    # Daily queue (factory, opportunities)
  workflow_dispatch:
  workflow_call:
    inputs:
      id:
        required: true
        type: string
      type:
        required: true
        type: string
      theme:
        required: true
        type: string
      status:
        required: true
        type: string
      agent:
        required: true
        type: string
      session:
        required: true
        type: string
      pr:
        required: false
        type: string

concurrency:
  group: agent-delegation
  cancel-in-progress: false

jobs:
  agent:
    uses: RokctAI/shared-workflows/.github/workflows/universal-agent.yml@a1ed8107168041aa252213ddcfa5279b00697195 # shared-workflows main @ 2026-11-27
    with:
      mode: 'auto'
      # Since the factory split, the factory's Level 0/1 prompt queue and job
      # cards live in the private RokctAI/books repo; the queue run checks it out.
      content-repo: ${{ github.repository == 'RokctAI/factory' && 'RokctAI/books' || '' }}
      ledger_id: ${{ inputs.id }}
      ledger_type: ${{ inputs.type }}
      ledger_theme: ${{ inputs.theme }}
      ledger_status: ${{ inputs.status }}
      ledger_agent: ${{ inputs.agent }}
      ledger_session: ${{ inputs.session }}
      ledger_pr: ${{ inputs.pr }}
    secrets:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
